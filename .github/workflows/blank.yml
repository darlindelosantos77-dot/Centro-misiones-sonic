name: Crear APK Centro de Misiones

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer archivos ZIP
        run: |
          unzip -q Centro_Misiones_Proyecto_Android.zip -d extraido
      - name: Activar Kotlin
        run: |
          sed -i "/com.android.application' version/a\\    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false" extraido/CentroMisionesAndroid/build.gradle
          sed -i "/id 'com.android.application'/a\\    id 'org.jetbrains.kotlin.android'" extraido/CentroMisionesAndroid/app/build.gradle
                - name: Configurar Java 17
         run: |
          sed -i '/compileOptions {/a\        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17' extraido/CentroMisionesAndroid/app/build.gradle
          sed -i '/kotlinOptions {/a\        jvmTarget = "17"' extraido/CentroMisionesAndroid/app/build.gradle
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: extraido/CentroMisionesAndroid
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Centro-de-Misiones-APK
          path: extraido/CentroMisionesAndroid/app/build/outputs/apk/debug/app-debug.apk
          
